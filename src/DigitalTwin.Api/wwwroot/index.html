<!doctype html><html lang="en"><head><meta charset="utf-8"/><title>DeveloperTwin — Frontend not built</title><meta name="viewport" content="width=device-width,initial-scale=1"/></head><body style="font-family:system-ui;background:#10172a;color:#eee;padding:10vh 12vw"><h1>DeveloperTwin React frontend needs to be built</h1><p>From the <code>frontend</code> folder, run <code>npm install</code> followed by <code>npm run build</code>, then restart <code>dotnet run</code>.</p><p>For live development, run <code>npm run dev</code> and open <a style="color:#aab5ff" href="http://127.0.0.1:5173">localhost:5173</a>. The API runs on port 5000.</p></body></html>
